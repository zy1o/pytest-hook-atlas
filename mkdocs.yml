site_name: pytest hook atlas
site_description: A visual reference for the order and nesting of pytest's hooks
site_url: https://zy1o.github.io/pytest-hook-atlas/
repo_url: https://github.com/zy1o/pytest-hook-atlas
repo_name: zy1o/pytest-hook-atlas
edit_uri: ""

# docs/ is generated by `hook-atlas build`; the committed inputs are
# scenarios/ (the code) and data/traces/ (the captures).
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zy1o/pytest-hook-atlas
