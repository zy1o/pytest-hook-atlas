site_name: pytest hook atlas
site_description: A visual reference for the order and nesting of pytest's hooks
site_url: https://zy1o.github.io/pytest-hook-atlas/
repo_url: https://github.com/zy1o/pytest-hook-atlas
repo_name: zy1o/pytest-hook-atlas
edit_uri: ""

# This is the template. `hook-atlas build` copies it to mkdocs.yml and
# appends a generated nav - the page set depends on how versions group, and
# per-version alias pages must stay out of the nav entirely.
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy

extra_css:
  - assets/atlas.css

markdown_extensions:
  - admonition
  - attr_list
  # implementer lists that changed mid-range are rendered as footnotes
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zy1o/pytest-hook-atlas
