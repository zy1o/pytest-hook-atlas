id = "xdist"
title = "Distributed across workers"
order = 6
# -n 2 rather than 1: two workers show that *every* worker collects the whole
# suite independently, which a single worker would hide.
#
# --dist each rather than a splitting scheduler. Under `loadfile`, `loadscope`,
# `load` or `worksteal` the workers split the suite, and then which worker draws
# which tests is a race: captured twice in a row, gw0 and gw1 swap flows. The
# split itself is stable, the labels are not, so the page would claim a
# difference between "gw0" and "gw1" that is only who won. `each` gives every
# worker the whole suite, so they are genuinely identical and the page can say
# so. The cost is honest and stated on the page: `each` is the one mode whose
# *controller* flow differs from the other four, which all agree.
args = ["-q", "-n", "2", "--dist", "each"]
# Pinned, not floated. Traces are immutable and the watcher only captures
# pytest releases it is missing, so a floating plugin would freeze at whatever
# pip resolved and never be re-captured. See AGENTS.md before bumping it.
requires = ["pytest-xdist==3.8.0"]
# pytest-xdist 3.8 needs pytest 7 or newer. Declared rather than discovered:
# pip resolves the whole install at once, so asking for pytest 6.0.0 alongside
# it installs pytest 8.4.2 instead of refusing, and the capture would be filed
# under 6.0.0 while describing 8.4.2.
pytest_versions = ">=7.0"
distributed = true
min_hooks = 20
expects = [
    "pytest_xdist_make_scheduler",
    "pytest_xdist_setupnodes",
    "pytest_configure_node",
    "pytest_testnodeready",
    "pytest_testnodedown",
    "pytest_xdist_node_collection_finished",
    "pytest_report_to_serializable",
    "pytest_report_from_serializable",
]
summary = "The controller and its workers, which see completely different runs."
description = """
Run under `pytest-xdist`, a session is several processes, and they do not see
the same thing at all. The process you launched - the controller - never
collects a test and never runs one. It starts workers, hands out work, and
receives results. Each worker collects the entire suite for itself, then runs
whatever it was given.

That is why this page has a diagram per process rather than one. The controller
reaches around 25 hooks, a worker around 41, and the overlap between them is
small.

**The scheduler changes what you see, so the command is printed with every
diagram below.** This capture uses `--dist each`, which gives every worker the
whole suite: the workers are then identical, and the page draws them once.
Under a splitting scheduler - `loadfile`, `loadscope`, `load`, `worksteal` -
workers differ by the tests they happened to draw, and this page would show one
section per distinct worker flow. The controller differs too: those four modes
all produce one controller flow, and `each` produces another.

This scenario also reaches the last two hooks pytest declares but never calls
itself: `pytest_report_to_serializable` in the workers, where a result is packed
up to be sent, and `pytest_report_from_serializable` in the controller, where it
is unpacked. And it brings twelve hooks of xdist's own, which pytest knows
nothing about - they are described here because hookspecs are read from the
running plugin manager rather than from pytest's source.
"""
