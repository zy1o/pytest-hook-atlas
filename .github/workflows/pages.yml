name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the full-map diagrams are rendered with Graphviz
      - name: Ensure Graphviz
        run: |
          # Skip apt entirely when the runner already ships Graphviz.
          if command -v dot >/dev/null; then dot -V; exit 0; fi
          # The runner image carries third-party apt repos (Chrome, Microsoft)
          # that intermittently serve mismatched hashes. apt-get update exits
          # 100 if *any* repo fails, so an unrelated Chrome index breaks this
          # build. Drop the repos we do not use rather than masking failures.
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome* \
                     /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          sudo apt-get install -y graphviz

      - run: pip install -e ".[docs]"

      # Deliberately no capture step. Rendering reads the committed traces and
      # nothing else, so the site can be rebuilt for a rendering or grouping
      # change without re-running pytest. It also keeps traces immutable: a
      # trace is a fact about one exact (pytest, pluggy, Python) triple, and
      # re-capturing it later against different dependencies would make the
      # version-to-version diffs untrustworthy. Capture belongs to the watcher.
      - run: hook-atlas build
      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
