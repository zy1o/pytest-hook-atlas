name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, to catch upstream docs moving
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # TEMPORARY: hook-atlas is not on PyPI yet, so it is installed from its
      # branch. Delete this step once hook-atlas 0.1.0 is released - the
      # dependency in pyproject.toml is already the version pin that replaces it.
      - run: pip install "hook-atlas @ git+https://github.com/zy1o/hook-atlas@extract-engine"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure Graphviz
        run: |
          # Skip apt entirely when the runner already ships Graphviz.
          if command -v dot >/dev/null; then dot -V; exit 0; fi
          # The runner image carries third-party apt repos (Chrome, Microsoft)
          # that intermittently serve mismatched hashes. apt-get update exits
          # 100 if *any* repo fails, so an unrelated Chrome index breaks this
          # build. Drop the repos we do not use rather than masking failures.
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome* \
                     /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          sudo apt-get install -y graphviz
      # docs extra too: the site sweep renders the real HTML, which is where
      # swallowed markup and unrendered footnotes actually show up
      # TEMPORARY: hook-atlas is not on PyPI yet, so it is installed from its
      # branch. Delete this step once hook-atlas 0.1.0 is released - the
      # dependency in pyproject.toml is already the version pin that replaces it.
      - run: pip install "hook-atlas @ git+https://github.com/zy1o/hook-atlas@extract-engine"
      - run: pip install -e ".[dev,docs]"
      - run: pytest -v

  linkcheck:
    # Hits docs.pytest.org, so it is kept out of the deploy path: a pytest docs
    # outage should not block publishing. This is the check that catches the
    # hook -> docs links rotting, which is how they broke last time.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # TEMPORARY: hook-atlas is not on PyPI yet, so it is installed from its
      # branch. Delete this step once hook-atlas 0.1.0 is released - the
      # dependency in pyproject.toml is already the version pin that replaces it.
      - run: pip install "hook-atlas @ git+https://github.com/zy1o/hook-atlas@extract-engine"
      - run: pip install -e .
      # reads the committed traces; no capture needed
      - run: hook-atlas linkcheck
